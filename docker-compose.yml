version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      JWT_SECRET: dev-secret-key
      DB_PATH: /app/data/db.json
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    command: npm --prefix backend run dev
    networks:
      - ecodvoinik-network

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - ecodvoinik-network

networks:
  ecodvoinik-network:
    driver: bridge
