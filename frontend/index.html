<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ЭкоДвойник — твой ассистент по ресурсам</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">🌱 ЭкоДвойник</div>
    <div class="tagline">AI-платформа для экономии ресурсов</div>
  </header>

  <main class="layout">
    <!-- Питомец -->
    <section class="pet-panel">
      <div id="pet-avatar" class="pet-avatar" data-mood="neutral">
        <svg viewBox="0 0 200 200" class="pet-svg" aria-hidden="true">
          <defs>
            <radialGradient id="petBodyGradient" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="var(--pet-light)" />
              <stop offset="100%" stop-color="var(--pet-main)" />
            </radialGradient>
          </defs>
          <!-- тень -->
          <ellipse cx="100" cy="178" rx="52" ry="10" fill="#000" opacity="0.08" />
          <!-- ушки / листики -->
          <g class="pet-ears">
            <ellipse cx="62" cy="46" rx="16" ry="24" fill="var(--pet-accent)" transform="rotate(-25 62 46)" />
            <ellipse cx="138" cy="46" rx="16" ry="24" fill="var(--pet-accent)" transform="rotate(25 138 46)" />
          </g>
          <!-- тело -->
          <g class="pet-body">
            <ellipse cx="100" cy="112" rx="62" ry="58" fill="url(#petBodyGradient)" />
          </g>
          <!-- щёчки -->
          <ellipse cx="66" cy="128" rx="10" ry="7" fill="var(--pet-cheek)" opacity="0.7" />
          <ellipse cx="134" cy="128" rx="10" ry="7" fill="var(--pet-cheek)" opacity="0.7" />
          <!-- глаза -->
          <g id="pet-eyes" class="pet-eyes">
            <circle cx="80" cy="108" r="7" fill="#2b2b2b" />
            <circle cx="120" cy="108" r="7" fill="#2b2b2b" />
            <circle cx="82.5" cy="105.5" r="2" fill="#fff" />
            <circle cx="122.5" cy="105.5" r="2" fill="#fff" />
          </g>
          <!-- рот -->
          <path id="pet-mouth" d="M 88 130 Q 100 140 112 130" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" />
        </svg>
      </div>
      <div class="pet-level">Уровень: <span id="pet-level">1</span></div>
      <div class="pet-mood-label" id="pet-mood-label">Настроение: нейтральное</div>

      <button id="rename-pet-btn" class="rename-btn" title="Дать питомцу имя">
        <span id="pet-name-display">Назвать питомца ✏️</span>
      </button>

      <div class="chat-box">
        <div id="chat-messages" class="chat-messages"></div>
        <form id="chat-form" class="chat-form">
          <input
            type="text"
            id="chat-input"
            placeholder="Спроси у питомца, куда уходят ресурсы..."
            autocomplete="off"
          />
          <button type="submit">Отправить</button>
        </form>
      </div>
    </section>

    <!-- Дашборд -->
    <section class="dashboard-panel">
      <div class="device-status" id="device-status">
        <span class="device-dot" id="device-dot"></span>
        <span id="device-status-text">Проверяю связь с датчиками...</span>
      </div>

      <h2>Сводка за неделю</h2>
      <div class="cards">
        <div class="card">
          <div class="card-title">💧 Вода</div>
          <div class="card-value" id="water-total">— л</div>
          <div class="card-sub" id="water-cost">— ₸</div>
          <div class="card-trend" id="water-trend">—</div>
        </div>
        <div class="card">
          <div class="card-title">⚡ Электричество</div>
          <div class="card-value" id="electricity-total">— кВт·ч</div>
          <div class="card-sub" id="electricity-cost">— ₸</div>
          <div class="card-trend" id="electricity-trend">—</div>
        </div>
        <div class="card highlight">
          <div class="card-title">💰 Итого за неделю</div>
          <div class="card-value" id="total-cost">— ₸</div>
        </div>
      </div>

      <div id="anomalies" class="anomalies"></div>

      <h3>Рекомендации</h3>
      <div id="recommendations" class="recommendations"></div>

      <h3>Добавить показание вручную</h3>
      <form id="reading-form" class="reading-form">
        <select id="reading-type">
          <option value="water">Вода (литры)</option>
          <option value="electricity">Электричество (кВт·ч)</option>
        </select>
        <input type="number" id="reading-value" placeholder="Значение" step="0.01" required />
        <button type="submit">Добавить</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    Future Minds Hackathon 2026 · Трек EcoFin · MVP
  </footer>

  <script src="js/api.js"></script>
  <script src="js/pet.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
